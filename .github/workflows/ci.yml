name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ubuntu:
    name: Ubuntu 24.04 / Zig 0.16
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            xz-utils \
            build-essential \
            pkg-config \
            libuv1-dev \
            libre2-dev \
            librocksdb-dev

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: zig version

      - name: Unit tests
        run: zig build test

      - name: RocksDB fake-DNS tests
        run: zig build test -Drocksdb=true

      - name: Target compile checks
        run: |
          printf 'pub const rocksdb = false;\n' > "$RUNNER_TEMP/build_options.zig"
          zig test -target aarch64-linux-gnu -I src/deps --dep build_options -Mroot=src/root.zig -Mbuild_options="$RUNNER_TEMP/build_options.zig" -fno-emit-bin
          zig test -target x86_64-linux-gnu -I src/deps --dep build_options -Mroot=src/root.zig -Mbuild_options="$RUNNER_TEMP/build_options.zig" -fno-emit-bin
          zig test -target aarch64-macos -I src/deps --dep build_options -Mroot=src/root.zig -Mbuild_options="$RUNNER_TEMP/build_options.zig" -fno-emit-bin
          zig test -target x86_64-macos -I src/deps --dep build_options -Mroot=src/root.zig -Mbuild_options="$RUNNER_TEMP/build_options.zig" -fno-emit-bin
          zig test -target x86_64-freebsd -I src/deps --dep build_options -Mroot=src/root.zig -Mbuild_options="$RUNNER_TEMP/build_options.zig" -fno-emit-bin
          zig test -target x86_64-openbsd -I src/deps --dep build_options -Mroot=src/root.zig -Mbuild_options="$RUNNER_TEMP/build_options.zig" -fno-emit-bin

      - name: Build
        run: zig build

      - name: Config checks
        run: |
          test -x zig-out/bin/ss-local
          test -x zig-out/bin/ss-server
          test -x zig-out/bin/ss-manager
          test -x zig-out/bin/ss-redir
          test -x zig-out/bin/ss-tunnel
          test -x zig-out/bin/sslocal
          test -x zig-out/bin/ssserver
          test -x zig-out/bin/ssmanager
          zig-out/bin/ss-zig --check -c tests/aes-gcm-redir.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-redir-udp.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-redir-pf.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-redir-pf-udp.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-fake-dns.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-key.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-no-delay.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-ipv6-first.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-reuse-port.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-tcp-buffers.json
          zig-out/bin/ss-zig --check -c tests/aes-gcm-string-numbers.json
          zig-out/bin/ss-zig --check -c tests/aead2022-aes128-tcp.json
          zig-out/bin/ss-local --check -c tests/aes-gcm-udp.json
          zig-out/bin/ssserver --check -c tests/aes-gcm-http.json
          zig-out/bin/ssmanager --check -c tests/aes-gcm-manager.json
          zig-out/bin/ss-local --check -s 127.0.0.1 -p 8388 -b 127.0.0.1 -l 1080 -k secret -m aes-256-gcm -u --plugin fake-plugin --plugin-opts mode=test
          zig-out/bin/ss-server --check -s 0.0.0.0 -p 8388 -k secret -m aes-128-gcm -U --manager-address 127.0.0.1:6001 --reuse-port
          zig-out/bin/ss-server --check -s example.com -p 8388 -k secret -m aes-128-gcm -6
          zig-out/bin/ss-server --check -s 127.0.0.1 -p 8388 -k secret -m aes-128-gcm --tcp-incoming-sndbuf 32768 --tcp-incoming-rcvbuf 32769 --tcp-outgoing-sndbuf 32770 --tcp-outgoing-rcvbuf 32771
          zig-out/bin/ss-server --check -s 127.0.0.1 -p 8388 --key AQIDBAUGBwgJCgsMDQ4PEA== -m aes-128-gcm
          if zig-out/bin/ss-server --check -s 127.0.0.1 -p 8388 -k secret -m none; then exit 1; fi
          zig-out/bin/ss-redir --check -s 127.0.0.1:8388 -l 1090 -k secret -m aes-256-gcm -u --tcp-redir redirect --udp-redir tproxy
          zig-out/bin/ss-tunnel --check -s 127.0.0.1 -p 8388 -l 5353 -k secret -m aes-256-gcm -u -L 8.8.8.8:53

      - name: Linux TCP redir startup
        run: |
          set +e
          timeout 2s zig-out/bin/ss-zig --local -c tests/aes-gcm-redir.json
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "expected redir local to start and wait for connections, got exit code $code" >&2
            exit "$code"
          fi

      - name: Linux UDP redir startup
        run: |
          set +e
          sudo timeout 2s zig-out/bin/ss-zig --local -c tests/aes-gcm-redir-udp.json
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "expected UDP redir local to start and wait for packets, got exit code $code" >&2
            exit "$code"
          fi
